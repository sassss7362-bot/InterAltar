# InterAltar - Кислотний вівтар
# Кольори: &a &l ...  HEX: &#39ff14

altar:
  build-seconds: 8            # анімація появи (5-10)
  activation-seconds: 100     # скільки йде активація після кліку по скрині
  open-seconds: 180           # скільки лут доступний, потім вівтар зникає
  remove-seconds: 6           # анімація зникнення
  ready-timeout-seconds: 900  # якщо ніхто не активував - вівтар зникає
  min-distance: 40            # мін. відстань між вівтарями
  max-clear-blocks: 40        # скільки твердих блоків можна зрізати при будівництві
  bossbar-radius: 80
  poison:
    seconds: 8
    level: 2

item:
  name: "&#39ff14&l☣ Кислотний Вівтар"
  lore:
    - "&7Постав на відкритому місці,"
    - "&7щоб викликати івент."

# Лут: у кожну скриню потрапляє per-chest предметів (мін, макс)
loot:
  per-chest: [5, 9]
  items:
    - { item: DIAMOND, min: 1, max: 3, weight: 10 }
    - { item: EMERALD, min: 2, max: 6, weight: 14 }
    - { item: GOLD_INGOT, min: 2, max: 8, weight: 16 }
    - { item: IRON_INGOT, min: 3, max: 10, weight: 18 }
    - { item: GOLDEN_APPLE, min: 1, max: 2, weight: 6 }
    - { item: ENCHANTED_GOLDEN_APPLE, min: 1, max: 1, weight: 1 }
    - { item: NETHERITE_INGOT, min: 1, max: 1, weight: 1 }
    - { item: TOTEM_OF_UNDYING, min: 1, max: 1, weight: 1 }
    - { item: EXPERIENCE_BOTTLE, min: 8, max: 24, weight: 10 }
    - { item: ENDER_PEARL, min: 1, max: 4, weight: 8 }
    - { item: SLIME_BALL, min: 4, max: 12, weight: 10 }
    - { item: SPIDER_EYE, min: 2, max: 6, weight: 8 }
    - { item: FERMENTED_SPIDER_EYE, min: 1, max: 3, weight: 5 }

