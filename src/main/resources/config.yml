  spawn: "&#39ff14&l☣ &#39ff14&l%player% &7заспавнив &#39ff14&lКислотний Вівтар &8(&f%x% %y% %z%&8)"
  ready: "&#39ff14☣ &fВівтар з'явився! &7Натисни &fправою кнопкою &7на будь-яку скриню, щоб активувати."
